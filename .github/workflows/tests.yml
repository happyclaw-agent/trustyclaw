name: Tests

on: [push, pull_request]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run ruff on smoke + compatibility paths
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: src
        run: |
          uv run ruff check \
            scripts/smoke_tests.py \
            src/tests/unit/test_simple.py \
            src/trustyclaw/sdk/__init__.py \
            src/clawtrust

      - name: Run representative unit lane with coverage gate
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: src
        run: |
          uv run pytest \
            src/tests/unit/test_simple.py \
            src/tests/unit/test_reputation_onchain.py \
            --cov=trustyclaw.sdk.reputation_chain \
            --cov=trustyclaw.sdk.reputation \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v --tb=short

      - name: Verify SDK imports
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: src
        run: |
          uv run python -c "
          from trustyclaw.sdk.client import SolanaClient
          from trustyclaw.sdk.identity import AgentIdentity
          from trustyclaw.sdk.reputation import ReputationEngine
          from trustyclaw.sdk.escrow import EscrowClient
          print('All imports successful')
          "

      - name: Run smoke tests
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: src
        run: uv run python scripts/smoke_tests.py

      - name: Run demo (mock mode only)
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: src
        run: uv run python demo.py --mock
